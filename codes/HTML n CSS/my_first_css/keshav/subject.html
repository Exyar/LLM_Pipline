<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!DOCTYPE html>
<html>
<head>
    <title>Subjects</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            padding:30px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#7b0000;
            margin-bottom:25px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-top:12px;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .buttons{
            text-align:center;
            margin-top:20px;
        }

        .btn{
            background:#7b0000;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:5px;
            cursor:pointer;
            margin:5px;
            font-size:16px;
        }

        .btn:hover{
            background:#a00000;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:30px;
        }

        table th,
        table td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        table th{
            background:#7b0000;
            color:white;
        }

        @media(max-width:768px){
            .container{
                padding:20px;
            }

            .btn{
                width:100%;
            }

            table{
                display:block;
                overflow-x:auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Subject Management</h2>

    <form>

        <label>Subject Code</label>
        <input type="text" placeholder="Enter Subject Code">

        <label>Subject Name</label>
        <input type="text" placeholder="Enter Subject Name">

        <label>Course</label>
        <select>
            <option>Select Course</option>
            <option>BCA</option>
            <option>B.Tech</option>
            <option>BBA</option>
            <option>B.Com</option>
            <option>B.Sc</option>
        </select>

        <label>Semester</label>
        <select>
            <option>Select Semester</option>
            <option>Semester 1</option>
            <option>Semester 2</option>
            <option>Semester 3</option>
            <option>Semester 4</option>
            <option>Semester 5</option>
            <option>Semester 6</option>
            <option>Semester 7</option>
            <option>Semester 8</option>
        </select>

        <label>Credits</label>
        <input type="number" placeholder="Enter Credits">

        <label>Subject Description</label>
        <textarea rows="4" placeholder="Enter Subject Description"></textarea>

        <div class="buttons">
            <button type="submit" class="btn">Add Subject</button>
            <button type="reset" class="btn">Clear</button>
        </div>

    </form>

    <table>
        <tr>
            <th>Subject Code</th>
            <th>Subject Name</th>
            <th>Course</th>
            <th>Semester</th>
            <th>Credits</th>
        </tr>

        <tr>
            <td>CS101</td>
            <td>Programming Fundamentals</td>
            <td>BCA</td>
            <td>1</td>
            <td>4</td>
        </tr>

        <tr>
            <td>CS201</td>
            <td>Data Structures</td>
            <td>BCA</td>
            <td>3</td>
            <td>4</td>
        </tr>

        <tr>
            <td>AI301</td>
            <td>Machine Learning</td>
            <td>B.Tech AI</td>
            <td>5</td>
            <td>5</td>
        </tr>
    </table>

</div>
</body>
</html>
