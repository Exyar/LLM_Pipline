<!DOCTYPE html>

<body>
  -<!DOCTYPE html>
<html>
<head>
    <title>Courses</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            padding:30px;
        }

        .container{
            max-width:800px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#7b0000;
            margin-bottom:25px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-top:12px;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .buttons{
            text-align:center;
            margin-top:20px;
        }

        .btn{
            background:#7b0000;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:5px;
            cursor:pointer;
            margin:5px;
            font-size:16px;
        }

        .btn:hover{
            background:#a00000;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:30px;
        }

        table th,
        table td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        table th{
            background:#7b0000;
            color:white;
        }

        @media(max-width:768px){
            .container{
                padding:20px;
            }

            .btn{
                width:100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Course Management</h2>

    <form>

        <label>Course Code</label>
        <input type="text" placeholder="Enter Course Code">

        <label>Course Name</label>
        <input type="text" placeholder="Enter Course Name">

        <label>Department</label>
        <select>
            <option>Select Department</option>
            <option>Computer Science</option>
            <option>Artificial Intelligence</option>
            <option>Information Technology</option>
            <option>Commerce</option>
            <option>Electrical Engineering</option>
        </select>

        <label>Duration</label>
        <input type="text" placeholder="Example: 4 Years">

        <label>Total Semesters</label>
        <input type="number" placeholder="Enter Number of Semesters">

        <label>Course Description</label>
        <textarea rows="4" placeholder="Enter Course Description"></textarea>

        <div class="buttons">
            <button type="submit" class="btn">Add Course</button>
            <button type="reset" class="btn">Clear</button>
        </div>

    </form>

    <table>
        <tr>
            <th>Course Code</th>
            <th>Course Name</th>
            <th>Duration</th>
        </tr>

        <tr>
            <td>BCA</td>
            <td>Bachelor of Computer Applications</td>
            <td>3 Years</td>
        </tr>

        <tr>
            <td>B.Tech</td>
            <td>Bachelor of Technology</td>
            <td>4 Years</td>
        </tr>

        <tr>
            <td>BBA</td>
            <td>Bachelor of Business Administration</td>
            <td>3 Years</td>
        </tr>
    </table>

</div>

</body>
</html>
</body>
</html>
