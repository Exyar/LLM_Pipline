<!DOCTYPE html>
<html>
<head>
    <title>Manage Account</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            padding:30px;
        }

        .container{
            max-width:800px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#7b0000;
            margin-bottom:25px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-top:12px;
        }

        input,
        textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .buttons{
            text-align:center;
            margin-top:20px;
        }

        .btn{
            background:#7b0000;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:5px;
            cursor:pointer;
            margin:5px;
            font-size:16px;
        }

        .btn:hover{
            background:#a00000;
        }

        .profile{
            text-align:center;
            margin-bottom:20px;
        }

        .profile img{
            width:120px;
            height:120px;
            border-radius:50%;
            border:3px solid #7b0000;
        }

        @media(max-width:768px){
            .container{
                padding:20px;
            }

            .btn{
                width:100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Manage Account</h2>

    <div class="profile">
        <img src="https://via.placeholder.com/120" alt="Profile Photo">
    </div>

    <form>

        <label>Administrator Name</label>
        <input type="text" value="Admin User">

        <label>Email Address</label>
        <input type="email" value="admin@college.com">

        <label>Mobile Number</label>
        <input type="tel" value="+91 9876543210">

        <label>College Name</label>
        <input type="text" value="ABC College">

        <label>Address</label>
        <textarea rows="4">College Address Here</textarea>

        <label>Upload New Profile Photo</label>
        <input type="file">

        <label>Current Password</label>
        <input type="password" placeholder="Enter Current Password">

        <label>New Password</label>
        <input type="password" placeholder="Enter New Password">

        <label>Confirm New Password</label>
        <input type="password" placeholder="Confirm New Password">

        <div class="buttons">
            <button type="submit" class="btn">Update Account</button>
            <button type="reset" class="btn">Reset</button>
        </div>

    </form>

</div>

</body>
</html>
